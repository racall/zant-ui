<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- Default DMG background for `zant build` (tools/zant/package):
       640×400 pt window; the app icon is placed at (170, 190) and the
       Applications folder at (470, 190), 128 pt icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#e9ecf1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <path d="M262 186 Q 320.0 140 372 186" fill="none" stroke="#9aa3b2" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12"/>
  <path d="M361.7 191.6 L382.5 195.3 L376.3 175.1" fill="none" stroke="#9aa3b2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
