# The Rust release Zant UI is built and tested with (`zant create` copies it
# from the framework's rust-toolchain.toml), so the app and the framework it
# compiles use the same compiler and nothing extra is downloaded. rustup
# installs it automatically on the first build.
[toolchain]
channel = "__RUST_TOOLCHAIN__"
profile = "minimal"
components = ["rustfmt", "clippy"]
