<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- macOS menu bar extra (status bar) icon — Apple Human Interface
       Guidelines: a template image (black + alpha only; the system tints it
       for light / dark menu bars and the highlighted state), 18 × 18 pt
       canvas (statusbar.png is 36 × 36 = @2x), glyph about 15 pt with a
       1.5 pt line, matching the weight of SF Symbols in the menu bar. -->
  <rect x="3.5" y="3.5" width="29" height="29" rx="8" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M12.5 12.5 H23.5 L12.5 23.5 H23.5" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
