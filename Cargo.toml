[workspace]
resolver = "3"
members = [
    "crates/zant-sys",
    "crates/zant-macros",
    "crates/zant",
    "crates/zant-tsx",
    "crates/zant-build",
    "crates/zant-cli",
    "crates/zant-examples",
    # TSX example apps: TSX → Rust in their own `build.rs`
    # (`zant_build::try_tsx_app()`, the `scaffold/template-ts` shape), built
    # and checked by the plain workspace commands.
    "crates/zant-examples/tsx/tsx-counter",
    "crates/zant-examples/tsx/tsx-demo",
    "crates/zant-examples/tsx/tsx-bench",
    "crates/zant-examples/tsx/tsx-gallery",
    "crates/zant-examples/tsx/tsx-todos",
    "crates/zant-examples/tsx/tsx-reader",
    "crates/zant-examples/tsx/tsx-notes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
# build / FFI
cc = "1.11"
embed-resource = "3.0"
# errors
thiserror = "2.0"
# data
png = "0.18"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wyhash = "0.6"
# TSX compiler: parse and pretty-print generated Rust
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.3"
# CLI
clap = { version = "4.6", features = ["derive"] }
notify = "8.2"

# internal crates
zant-sys = { path = "crates/zant-sys", version = "0.1.0" }
zant-macros = { path = "crates/zant-macros", version = "0.1.0" }
zant = { path = "crates/zant", version = "0.1.0" }
zant-tsx = { path = "crates/zant-tsx", version = "0.1.0" }
zant-build = { path = "crates/zant-build", version = "0.1.0" }

# Integer overflow panics in release builds too.
[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true
