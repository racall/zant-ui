[package]
name = "zant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `zant` command line tool (create / run / compile / package / build / sync / update)"
# Zant is used from source or the installed release, not crates.io
# (zant-sys needs the prebuilt Skia / PDFium assets).
publish = false

[[bin]]
name = "zant"
path = "src/main.rs"

[dependencies]
zant-tsx.workspace = true
zant-build.workspace = true
clap.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
