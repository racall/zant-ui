[package]
name = "zant-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Build-script helpers for Zant applications (replaces addTsxApp / configureApp)"

[dependencies]
zant-tsx.workspace = true
thiserror.workspace = true
# Windows `.ico` generation from `assets/icons/app-windows.png` (Zig's
