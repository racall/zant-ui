[package]
name = "zant-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Build-script helpers for Zant applications (replaces addTsxApp / configureApp)"
# Zant is used from source or the installed release, not crates.io
# (zant-sys needs the prebuilt Skia / PDFium assets).
publish = false

[dependencies]
zant-tsx.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
prettyplease.workspace = true
# Windows `.ico` generation from `assets/icons/app-windows.png`.
png.workspace = true

[target.'cfg(windows)'.dependencies]
embed-resource.workspace = true

[dev-dependencies]
syn.workspace = true
