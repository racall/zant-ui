[package]
name = "zant-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runnable examples for Zant UI (zant-demo, zant-components, zant-gallery, ...)"
# Zant is used from source or the installed release, not crates.io
# (zant-sys needs the prebuilt Skia / PDFium assets).
publish = false

[build-dependencies]
# `build.rs` compiles the TSX benchmark pages of `zant-tsx-frame-bench` into
# `$OUT_DIR` with the same TSX → Rust step a Zant app's build script uses
# (`zant_build::tsx_app_in`).
zant-build.workspace = true

[dependencies]
zant.workspace = true
# `zant-md-stream --sse` parses SSE JSON events.
serde_json.workspace = true
# `zant-tsx-bench` drives the TSX compiler in process.
zant-tsx.workspace = true

[[bin]]
name = "zant-demo"
path = "src/bin/zant-demo/main.rs"

[[bin]]
name = "zant-components"
path = "src/bin/zant-components.rs"

[[bin]]
name = "zant-gallery"
path = "src/bin/zant-gallery.rs"

[[bin]]
name = "zant-markdown"
path = "src/bin/zant-markdown.rs"

[[bin]]
name = "zant-math"
path = "src/bin/zant-math.rs"

[[bin]]
name = "zant-md-stream"
path = "src/bin/zant-md-stream.rs"

[[bin]]
name = "zant-pdf"
path = "src/bin/zant-pdf.rs"

# Headless frame benchmark; the app and scenarios live in the bin-local
# `zant_bench` module. `scripts/bench.sh` gates its numbers.
[[bin]]
name = "zant-bench"
path = "src/bin/zant-bench.rs"

# TSX compile benchmark: every `crates/zant-tsx/testdata/tsx/*.tsx` through
# `zant_tsx::compile`, warm-up + iterations, in the frame benchmark's
# statistics format. `scripts/tsx/examples-check.sh` runs it.
[[bin]]
name = "zant-tsx-bench"
path = "src/bin/zant-tsx-bench.rs"

# TSX frame benchmark. It runs each TSX page's generated app against a
# hand-written `ui::App` control through the same headless frame loop and gates
# the TSX/manual ratio at 1.2× (`scripts/tsx/bench-tsx.sh`). The TSX → Rust
# step happens for this whole crate in `build.rs`.
[[bin]]
name = "zant-tsx-frame-bench"
path = "src/bin/zant-tsx-frame-bench.rs"
