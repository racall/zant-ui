[package]
name = "zant-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runnable examples for Zant UI (zant-demo, zant-components, zant-gallery, ...)"

[dependencies]
zant.workspace = true
# `zant-md-stream --sse` parses the same SSE JSON events as the Zig example
# (`std.json.parseFromSlice`).
serde_json.workspace = true
# `zant-tsx-bench` (WP-5.10) drives the TSX compiler in process; the Zig frame
# benchmark's compile-side baseline is `tools/tsx/compile_bench.zig`.
zant-tsx.workspace = true

[[bin]]
name = "zant-demo"
path = "src/bin/zant-demo.rs"

[[bin]]
name = "zant-components"
path = "src/bin/zant-components.rs"

[[bin]]
name = "zant-gallery"
path = "src/bin/zant-gallery.rs"

[[bin]]
name = "zant-markdown"
path = "src/bin/zant-markdown.rs"

[[bin]]
name = "zant-math"
path = "src/bin/zant-math.rs"

[[bin]]
name = "zant-md-stream"
path = "src/bin/zant-md-stream.rs"

[[bin]]
name = "zant-pdf"
path = "src/bin/zant-pdf.rs"

# Headless frame benchmark (port of `examples/bench.zig`, WP-2.11); the app and
# scenarios live in the bin-local `zant_bench` module.
[[bin]]
name = "zant-bench"
path = "src/bin/zant-bench.rs"

# TSX compile benchmark (port of the compile-time half of `examples/tsx/
# bench.zig`, WP-5.10): every `tools/tsx/testdata/*.tsx` through
# `zant_tsx::compile`, warm-up + iterations, in the Zig frame benchmark's
# statistics format. `scripts/tsx/examples-check.sh` runs it against the Zig
# baseline (`tools/tsx/compile_bench.zig`) and gates the ratio.
[[bin]]
name = "zant-tsx-bench"
path = "src/bin/zant-tsx-bench.rs"
