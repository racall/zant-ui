# Pins the Rust toolchain of the workspace.
#
# One exact release for everyone working on the framework and for CI, so a
# new clippy lint or rustfmt change in a later stable cannot break the build
# or the checked-in bindgen output. Bump it deliberately (and rerun
# scripts/gen_bindings.sh). Apps created by `zant create` use stable.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
