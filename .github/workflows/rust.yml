# Rust port CI: formatting, clippy, tests and the Zig parity build.
#
# Mirrors plan.md §3 rule 7 on both platforms:
#   cargo fmt --all -- --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test -p <crate> / cargo test --workspace
#   zig build test          (the Zig version stays buildable during the port)
name: rust

on:
  push:
    branches: ["feat/rust-port", main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.1
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Skia (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/fetch_skia.sh

      - name: Skia, PDFium, fonts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch_skia_windows.ps1

      - name: Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: checked-in bindings are up to date
        if: runner.os == 'macOS'
        run: |
          cargo install bindgen-cli --locked
          ./scripts/gen_bindings.sh
          git diff --exit-code crates/zant-sys/src

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # The Zig framework must keep building: it is the behavior reference.
      - name: zig build test
        run: zig build test
