# Rust port CI: formatting, clippy, tests and the Zig parity build.
#
# Mirrors plan.md §3 rule 7 on both platforms:
#   cargo fmt --all -- --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test -p <crate> / cargo test --workspace
#   zig build test          (the Zig version stays buildable during the port)
name: rust

on:
  push:
    branches: ["feat/rust-port", main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.1
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Skia (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/fetch_skia.sh

      - name: Skia, PDFium, fonts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch_skia_windows.ps1

      - name: Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: checked-in bindings are up to date
        if: runner.os == 'macOS'
        run: |
          cargo install bindgen-cli --locked
          ./scripts/gen_bindings.sh
          git diff --exit-code crates/zant-sys/src

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # The generated TSX tag table and zant.d.ts are checked in (WP-5.2). They
      # are produced from the `#[derive(TsxProps)]` metadata of the `zant` crate,
      # not from a hand-maintained list, so a new option struct or builder must
      # come with a regenerated table:
      #   cargo run -p zant-tsx --bin zant-tsx-tags -- crates/zant-tsx/src/ui_tags.rs
      #   cargo run -p zant-tsx --bin zant-tsx-dts -- crates/zant-tsx/zant.d.ts
      # `--check` prints `run ...` when a file is stale; `git diff --exit-code`
      # additionally catches a file that is not tracked.
      - name: generated TSX tables are up to date
        if: runner.os == 'macOS'
        run: |
          cargo run -p zant-tsx --bin zant-tsx-tags -- --check crates/zant-tsx/src/ui_tags.rs
          cargo run -p zant-tsx --bin zant-tsx-dts -- --check crates/zant-tsx/zant.d.ts
          git diff --exit-code -- crates/zant-tsx/src/ui_tags.rs crates/zant-tsx/zant.d.ts

      # The Zig framework must keep building: it is the behavior reference.
      - name: zig build test
        run: zig build test
