# Rust CI: formatting, clippy and the test suite on both platforms.
#
#   cargo fmt --all -- --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace
name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Skia (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/fetch_skia.sh

      - name: Skia, PDFium, fonts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch_skia_windows.ps1

      # rust-toolchain.toml pins the exact release; rustup installs it (with
      # rustfmt and clippy) on the first cargo call.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: checked-in bindings are up to date
        if: runner.os == 'macOS'
        run: |
          cargo install bindgen-cli --version 0.73.2 --locked
          ./scripts/gen_bindings.sh
          git diff --exit-code crates/zant-sys/src

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # files stay at about 500 lines; older long files may only shrink
      - name: file sizes
        if: runner.os == 'macOS'
        run: ./scripts/check-file-size.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # The optional parts of `zant` (Markdown, math, PDF, SQLite, fetch)
      # are Cargo features: the framework must build without them.
      - name: zant without optional features
        run: |
          cargo check -p zant --no-default-features
          cargo check -p zant --no-default-features --features markdown
          cargo check -p zant --no-default-features --features pdf,db

      # The generated TSX tag table and zant.d.ts are checked in. They
      # are produced from the `#[derive(TsxProps)]` metadata of the `zant` crate,
      # not from a hand-maintained list, so a new option struct or builder must
      # come with a regenerated table:
      #   cargo run -p zant-tables --bin zant-tsx-tags -- crates/zant-tsx/src/ui_tags
      #   cargo run -p zant-tables --bin zant-tsx-dts -- crates/zant-tsx/zant.d.ts
      # `--check` prints `run ...` when a file is stale; `git diff --exit-code`
      # additionally catches a file that is not tracked.
      - name: generated TSX tables are up to date
        if: runner.os == 'macOS'
        run: |
          cargo run -p zant-tables --bin zant-tsx-tags -- --check crates/zant-tsx/src/ui_tags
          cargo run -p zant-tables --bin zant-tsx-dts -- --check crates/zant-tsx/zant.d.ts
          git diff --exit-code -- crates/zant-tsx/src/ui_tags crates/zant-tsx/zant.d.ts

      # TSX compiled to Rust must print what Node prints
      # (crates/zant-tsx/tests/node_parity/*.ts; Node 22.6+ strips the types).
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22

      - name: TSX output matches Node
        if: runner.os == 'macOS'
        run: ./scripts/tsx/node-parity.sh
